services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MAX_UPLOAD_BYTES: "10485760"
      CORS_ORIGINS: "http://127.0.0.1:8080,http://localhost:8080"
      PHISHGUARD_DB: "/data/phishguard.db"
    volumes:
      - phishguard-data:/data
    restart: unless-stopped
  frontend:
    image: python:3.11-slim
    working_dir: /site
    volumes:
      - ./frontend:/site:ro
    command: python -m http.server 8080 --bind 0.0.0.0
    ports:
      - "8080:8080"
    depends_on:
      - api
volumes:
  phishguard-data:
